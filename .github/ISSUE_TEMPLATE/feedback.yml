name: Feedback or feature request
description: Ideas, what you'd use Ogun for, what's missing, what you'd pay for.
labels: [feedback]
body:
  - type: textarea
    id: feedback
    attributes:
      label: Your feedback
    validations:
      required: true
  - type: textarea
    id: usecase
    attributes:
      label: What were you trying to do with Ogun?
